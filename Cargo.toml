[workspace]
members = [
    "crates/contextdrop-core",
    "crates/contextdrop-cli",
    "crates/contextdrop-server",
    "crates/contextdrop-mcp",
]
resolver = "2"
default-members = [
    "crates/contextdrop-core",
    "crates/contextdrop-cli",
    "crates/contextdrop-server",
    "crates/contextdrop-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/CyberBoyNitin/ContextDrop"
homepage = "https://github.com/CyberBoyNitin/ContextDrop"
authors = ["ContextDrop contributors"]

[workspace.dependencies]
contextdrop-core = { path = "crates/contextdrop-core", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tiktoken-rs = "0.12.1"
thiserror = "2.0"
tokio = { version = "1.46", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
axum = "0.8"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["fs"] }
similar = "3.2"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"
proptest = "1.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
